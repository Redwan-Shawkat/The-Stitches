[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stitches"
version = "0.2.4"
description = "Linux system toolkit: updates, uninstall, cleanup, drivers and defrag across apt/.deb, Snap, Flatpak, Wine and GitHub AppImages."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# No pip dependencies on purpose: PyGObject/GTK3 ships with the OS on any
# Ubuntu/GNOME desktop. See documents/ai-knowledgebase.md.
dependencies = []

[project.scripts]
stitches = "stitches.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
