<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#1f2937"/>
  <!-- Hourglass silhouette: a normal "A" (peak at top) crossed with its own
       180-degree-rotated twin, a "V" (peak at bottom), drawn as curved
       strokes rather than type glyphs, so it renders identically everywhere
       with no font dependency and reads as one glass/hourglass shape. -->
  <path d="M 22,78 C 34,50 38,38 50,20 C 62,38 66,50 78,78"
        fill="none" stroke="#e5e7eb" stroke-width="7" stroke-linecap="round"/>
  <path d="M 22,22 C 34,50 38,62 50,80 C 62,62 66,50 78,22"
        fill="none" stroke="#e5e7eb" stroke-width="7" stroke-linecap="round"/>
</svg>
