[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-the-uninstaller"
version = "0.1.0"
description = "Finds and removes Windows software regardless of how it was installed: MSI/EXE installers, Microsoft Store, Chocolatey, or Scoop."
requires-python = ">=3.10"
license = "MIT"
# No pip dependencies on purpose: tkinter, winreg and ctypes all ship with
# Python on Windows. PyInstaller and WiX are build-time only — see
# ../documents/ai-knowledgebase.md.
dependencies = []

[project.gui-scripts]
windows-the-uninstaller = "uninstaller.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
