# Builds the Android release APK.
#
# Unlike the Windows workflow this one doesn't need a special runner — the
# Android toolchain is cross-platform and the Linux runner already has the
# SDK. It's here for the signing key: a release APK has to be signed with the
# project's own key, and that key lives in repository secrets rather than on
# anyone's laptop. Run it from the Actions tab for a test build, or push a v*
# tag to have the APK attached to that release.
name: Android build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # only used by the release-upload step below

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::A tagged release must be signed; set ANDROID_KEYSTORE_B64." >&2
              exit 1
            fi
            echo "::warning::No signing secrets — this APK will not be installable."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Tests
        run: ./gradlew --console=plain test

      - name: Build the APK
        run: ./gradlew --console=plain assembleRelease

      - name: Collect
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release*.apk "dist/TheUninstaller-$VERSION.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: the-uninstaller-android
          path: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --clobber
